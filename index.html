<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1 Mês 🦋🐟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container" id="main-card">
    <header class="header">
      <span class="small-date">1 mês juntos 🦋 🐟</span>
      <h1 class="title">Feliz um mês de namoro</h1>
    </header>

    <!-- Mural de fotos estilo polaroid -->
    <div class="photos-strip" id="photos-strip">
      <figure class="polaroid p1">
        <img src="foto1.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
      <figure class="polaroid p2">
        <img src="foto2.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
      <figure class="polaroid p3">
        <img src="foto3.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
    </div>

    <div class="question-section">
      <p class="question">Quer passar o resto dos seus dias comigo?</p>
      <p class="hint" id="tap-hint"></p>

      <div class="buttons-area" id="buttons-area">
        <button type="button" class="btn btn-yes" id="btn-yes">Sim</button>
        <button type="button" class="btn btn-no" id="btn-no">Não</button>
      </div>
    </div>
  </main>

  <!-- Tela que aparece depois de apertar "Sim" 5 vezes -->
  <section class="container hidden" id="celebration-card">
    <span class="small-date">🦋 🐟 🐠</span>
    <h1 class="title">Sabia que você ia dizer sim</h1>

    <div class="photos-strip celebration-photos">
      <figure class="polaroid p1">
        <img src="foto1.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
      <figure class="polaroid p2">
        <img src="foto2.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
      <figure class="polaroid p3">
        <img src="foto3.jpg" alt="Nós dois" onerror="this.parentElement.classList.add('empty-photo')" />
      </figure>
    </div>

    <p class="final-text">
      Mesmo tendo que apertar 5 vezes. Feliz primeiro mês, meu amor 🦋🐟
    </p>
  </section>

  <script src="script.js"></script>
</body>
</html>
