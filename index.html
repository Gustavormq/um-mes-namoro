<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1 Mês 🦋🐟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Camada de glitter brilhando e borboletas/peixes subindo ao fundo -->
  <div class="glitter-layer" id="glitter-layer" aria-hidden="true"></div>
  <div class="floating-bg" id="floating-bg" aria-hidden="true"></div>

  <main class="container" id="main-card">
    <header class="header">
      <span class="small-date">1 mês juntos 🦋 🐟</span>
      <h1 class="title">Feliz um mês de namoro</h1>
    </header>

    <!-- 3 Polaroids lado a lado no celular -->
    <div class="polaroid-row" id="polaroid-stage">
      <figure class="polaroid p1" data-index="0">
        <span class="tape"></span>
        <img src="foto1.jpg" alt="Nós dois no parque" />
        <figcaption>nós dois 🦋</figcaption>
      </figure>
      <figure class="polaroid p2" data-index="1">
        <span class="tape"></span>
        <img src="foto2.jpg" alt="Nós dois de pertinho" />
        <figcaption>meu lugar 🐟</figcaption>
      </figure>
      <figure class="polaroid p3" data-index="2">
        <span class="tape"></span>
        <img src="foto3.jpg" alt="Nós dois à noite" />
        <figcaption>cada momento 🐠</figcaption>
      </figure>
    </div>

    <div class="question-section">
      <p class="question">Quer passar o resto dos seus dias comigo?</p>
      <p class="hint" id="tap-hint"></p>

      <div class="buttons-area" id="buttons-area">
        <button type="button" class="btn btn-yes" id="btn-yes">Sim</button>
        <button type="button" class="btn btn-no" id="btn-no">Não</button>
      </div>
    </div>
  </main>

  <!-- Tela que aparece depois de apertar "Sim" 5 vezes -->
  <section class="container celebration-container hidden" id="celebration-card">
    <header class="header">
      <span class="small-date">1 mês de muitos 🦋 🐟 🐠</span>
      <h1 class="title">nOhvis, sabia que ce ia aceitar</h1>
      <p class="final-text">
        Mesmo tendo que caçar o botão 5 vezes pela tela. Feliz primeiro mês, meu amor 🦋🐟
      </p>
    </header>

    <div class="polaroid-row celebration-row">
      <figure class="polaroid p1">
        <span class="tape"></span>
        <img src="foto1.jpg" alt="Nós dois no parque" />
        <figcaption>nosso mundinho 🦋</figcaption>
      </figure>

      <figure class="polaroid p2">
        <span class="tape"></span>
        <img src="foto2.jpg" alt="Nós dois de pertinho" />
        <figcaption>meu sorriso 🐟</figcaption>
      </figure>

      <figure class="polaroid p3">
        <span class="tape"></span>
        <img src="foto3.jpg" alt="Nós dois à noite" />
        <figcaption>borboleta & peixe 🐠</figcaption>
      </figure>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
